name: OneShot CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  python:
    name: python / pytest / ruff / pip-audit (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with: {enable-cache: true}
      - run: uv python install 3.11
      - run: uv sync --locked --extra test
      - run: uv run ruff check .
      - run: uv run pytest
      - run: uv run pytest tests/test_workflow_conformance.py -v
      - name: pip-audit
        run: |
          uv export --format requirements-txt --no-dev --no-editable --no-emit-workspace --no-emit-project > /tmp/req.txt
          uv run --with pip-audit pip-audit --requirement /tmp/req.txt --disable-pip
      - name: Python SBOM (CycloneDX)
        run: |
          mkdir -p dist
          uv run --with pip-audit pip-audit --requirement /tmp/req.txt --disable-pip --format cyclonedx-json --output dist/sbom.python.cyclonedx.json
      - name: Upload Python SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom-python
          path: dist/sbom.python.cyclonedx.json

  frontend:
    name: frontend / tests / check / build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "22"}
      - working-directory: frontend
        run: npm ci --no-audit --fund=false
      - working-directory: frontend
        run: npm run check
      - working-directory: frontend
        run: npm test
      - working-directory: frontend
        run: npm run build
      - working-directory: frontend
        run: npm audit --omit=dev --audit-level=high
      - name: Frontend SBOM (CycloneDX)
        run: |
          mkdir -p ../dist
          npm sbom --omit=dev --sbom-format=cyclonedx > ../dist/sbom.frontend.cyclonedx.json
        working-directory: frontend
      - name: Upload Frontend SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom-frontend
          path: dist/sbom.frontend.cyclonedx.json

  e2e:
    name: e2e (http + presend + browser + prompts + improvement loop)
    runs-on: ubuntu-latest
    needs: [python, frontend]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with: {node-version: "22"}
      - run: uv python install 3.11
      - run: uv sync --locked --extra test
      - working-directory: frontend
        run: npm ci --no-audit --fund=false
      - working-directory: frontend
        run: npm run build
      - run: uv run playwright install chromium --with-deps
      - run: uv run python -m tests.e2e_http
      - run: uv run python -m tests.e2e_presend
      - run: uv run python -m tests.e2e_browser
      - run: uv run python -m tests.e2e_live_model_local
      - run: uv run python -m tests.e2e_backup_restore
      - run: uv run python -m tests.e2e_multi_provider_http
      - run: uv run python -m tests.e2e_prompt_workspace
      - run: uv run python -m tests.e2e_improvement_loop
      - run: uv run python -m tests.e2e_improvement_loop_closure
