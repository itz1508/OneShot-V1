[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "oneshot-system"
version = "0.3.0"
description = "OneShot independent System workspace"
requires-python = ">=3.11,<3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "pydantic>=2.10,<3",
  "httpx>=0.27,<1",
]

[project.optional-dependencies]
test = ["pytest>=8,<10", "playwright>=1.50,<2"]

[tool.setuptools.packages.find]
include = ["systems*", "capabilities*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
# OneShot ships intentionally compact one-line statements; keep the style, enforce correctness only.
line-length = 320
target-version = "py311"

[tool.ruff.lint]
# Correctness-only selection. Explicitly skip whitespace / line-length / stylistic density rules the shipped code opts into.
select = ["F", "B", "UP", "SIM"]
# E701/E702 colon/semicolon density, E501 line length, UP007 PEP604 unions, UP017 datetime.UTC alias — these are deliberate style choices in the shipped source.
ignore = ["E501", "E701", "E702", "E703", "UP007", "UP017", "UP041", "SIM105", "SIM108", "SIM117", "F403", "F405", "B023", "B007"]

[tool.ruff.lint.per-file-ignores]
# Tests may use broad fixtures and loop-free scaffolding; keep hygiene checks but tolerate scaffold imports.
"tests/*.py" = ["F401", "F811", "F841"]
"scripts/*.py" = ["F401", "F841", "B007"]
"systems/operations.py" = ["F841"]
